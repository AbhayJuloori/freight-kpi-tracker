[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "freight-kpi-tracker"
version = "2.0.0.dev0"
description = "Portable freight operations investigation and anomaly evaluation system"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pandas==2.3.3",
  "numpy==2.0.2",
  "pyarrow==23.0.1",
  "duckdb==1.5.4",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.15.22",
]
legacy = [
  "snowflake-connector-python==3.7.0",
  "python-dotenv==1.2.1",
  "plotly==5.24.1",
  "dash==2.17.1",
  "dash-bootstrap-components==1.6.0",
  "matplotlib==3.9.0",
  "seaborn==0.13.2",
]

[project.scripts]
freight-v2 = "freight_v2.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  "Codex-brain",
  "memory",
  # Frozen v1 regression tests remain runnable but are outside the v2 lint gate.
  "tests/test_generate_synthetic.py",
  "tests/test_integration.py",
  "tests/test_script_regressions.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
